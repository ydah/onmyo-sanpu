name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cflags: -std=c11 -Wall -Wextra -Werror -O2
          - os: ubuntu-latest
            cc: clang
            cflags: -std=c11 -Wall -Wextra -Werror -O2
          - os: macos-latest
            cc: clang
            cflags: -std=c11 -Wall -Wextra -Werror -O2
          - os: ubuntu-latest
            cc: clang
            cflags: -std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          make clean
          make
        env:
          CC: ${{ matrix.cc }}
          CFLAGS: ${{ matrix.cflags }}

      - name: Test
        run: ./test/run.sh

      - name: Lint (構文境界の検査)
        run: |
          if grep -Rn '[「」『』〔〕〘〙]' examples README.md; then exit 1; fi
          if grep -Rn --include='*.fu' --exclude='tatari_invalid_boundary.fu' '[「」『』〔〕〘〙]' test/cases; then exit 1; fi
